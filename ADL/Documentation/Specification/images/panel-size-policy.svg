<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 182"
             width="100%" role="img"
             aria-labelledby="adl-panel-sizing-title adl-panel-sizing-desc"
             style="max-width: 720px; height: auto">
          <title id="adl-panel-sizing-title">Content and Fixed panel sizing</title>
          <desc id="adl-panel-sizing-desc">The Content panel tightly encloses two children and spacing. The Fixed panel has an explicit larger rectangle around identical children.</desc>
          <g font-family="sans-serif" fill="#334155" text-anchor="middle" font-size="16">
            <text x="175" y="22">Content</text>
            <text x="545" y="22">Fixed</text>
          </g>
          <rect x="82" y="38" width="186" height="122" rx="6" fill="none" stroke="#64748b" stroke-width="2"/>
          <rect x="386" y="38" width="318" height="122" rx="6" fill="none" stroke="#64748b" stroke-width="2"/>
          <g fill="#fef3c7" stroke="#b45309" stroke-width="1.5">
            <rect x="101" y="56" width="148" height="34" rx="3"/>
            <rect x="101" y="107" width="148" height="34" rx="3"/>
            <rect x="406" y="56" width="148" height="34" rx="3"/>
            <rect x="406" y="107" width="148" height="34" rx="3"/>
          </g>
          <g font-family="sans-serif" font-size="13" text-anchor="middle" fill="#78350f">
            <text x="175" y="78">Child 1</text>
            <text x="175" y="129">Child 2</text>
            <text x="480" y="78">Child 1</text>
            <text x="480" y="129">Child 2</text>
          </g>
          <g font-family="sans-serif" font-size="11" fill="#475569">
            <text x="175" y="176" text-anchor="middle">Desired size follows content</text>
            <text x="545" y="176" text-anchor="middle">Desired size remains explicit</text>
          </g>
        </svg>
