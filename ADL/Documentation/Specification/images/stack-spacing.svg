<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 232"
             width="100%" role="img"
             aria-labelledby="adl-panel-spacing-title adl-panel-spacing-desc"
             style="max-width: 720px; height: auto">
          <title id="adl-panel-spacing-title">Panel padding, per-child margin, and StackLayout gap</title>
          <desc id="adl-panel-spacing-desc">A panel border surrounds a dashed content area. Two blue children have green margins. Orange space between their margin boxes denotes the stack gap.</desc>
          <rect x="14" y="28" width="692" height="172" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
          <rect x="55" y="58" width="610" height="112" rx="3" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/>
          <rect x="88" y="74" width="220" height="78" rx="4" fill="#d1fae5" stroke="#047857" stroke-width="1.4" stroke-dasharray="4 3"/>
          <rect x="119" y="89" width="160" height="48" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
          <rect x="390" y="74" width="220" height="78" rx="4" fill="#d1fae5" stroke="#047857" stroke-width="1.4" stroke-dasharray="4 3"/>
          <rect x="420" y="89" width="160" height="48" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
          <rect x="308" y="74" width="82" height="78" fill="#fed7aa" fill-opacity="0.65"/>
          <g font-family="sans-serif" font-size="15" text-anchor="middle" fill="#1e3a8a">
            <text x="199" y="117">Child 1</text>
            <text x="500" y="117">Child 2</text>
          </g>
          <g font-family="sans-serif" font-size="13" text-anchor="middle" fill="#7c2d12">
            <text x="349" y="113">gap</text>
          </g>
          <g font-family="sans-serif" font-size="12" fill="#334155">
            <text x="28" y="18">Panel border</text>
            <text x="59" y="49">Content area (after padding)</text>
            <text x="120" y="217">Green outlines: child margins</text>
            <text x="439" y="217">Orange: inter-child gap</text>
          </g>
        </svg>
