<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230"
             width="100%" role="img"
             aria-labelledby="adl-stack-orientation-title adl-stack-orientation-desc"
             style="max-width: 720px; height: auto">
          <title id="adl-stack-orientation-title">Vertical and horizontal StackLayout orientation</title>
          <desc id="adl-stack-orientation-desc">On the left, three children are stacked from top to bottom with gaps. On the right, the same children are arranged from left to right with gaps.</desc>
          <rect x="10" y="34" width="330" height="163" rx="8" fill="none" stroke="#64748b" stroke-width="2"/>
          <rect x="380" y="34" width="330" height="163" rx="8" fill="none" stroke="#64748b" stroke-width="2"/>
          <g font-family="sans-serif" font-size="16" fill="#334155">
            <text x="175" y="23" text-anchor="middle">Vertical</text>
            <text x="545" y="23" text-anchor="middle">Horizontal</text>
          </g>
          <g fill="#dbeafe" stroke="#2563eb" stroke-width="1.5">
            <rect x="90" y="48" width="170" height="35" rx="4"/>
            <rect x="90" y="95" width="170" height="35" rx="4"/>
            <rect x="90" y="142" width="170" height="35" rx="4"/>
            <rect x="393" y="88" width="89" height="48" rx="4"/>
            <rect x="493" y="88" width="89" height="48" rx="4"/>
            <rect x="593" y="88" width="89" height="48" rx="4"/>
          </g>
          <g font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">
            <text x="175" y="70">Child 1</text>
            <text x="175" y="117">Child 2</text>
            <text x="175" y="164">Child 3</text>
            <text x="437" y="116">Child 1</text>
            <text x="537" y="116">Child 2</text>
            <text x="637" y="116">Child 3</text>
          </g>
          <g font-family="sans-serif" font-size="12" fill="#475569" text-anchor="middle">
            <text x="175" y="215">main axis: height</text>
            <text x="545" y="215">main axis: width</text>
          </g>
        </svg>
