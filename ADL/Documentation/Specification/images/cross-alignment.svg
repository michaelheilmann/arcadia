<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 132"
             width="100%" role="img"
             aria-labelledby="adl-stack-alignment-title adl-stack-alignment-desc"
             style="max-width: 720px; height: auto">
          <title id="adl-stack-alignment-title">Cross-axis alignment in a vertical stack</title>
          <desc id="adl-stack-alignment-desc">Four containers show the same narrow child aligned at the left, center, right, and stretched to the available width.</desc>
          <g fill="none" stroke="#64748b" stroke-width="2">
            <rect x="10" y="29" width="162" height="78" rx="6"/>
            <rect x="189" y="29" width="162" height="78" rx="6"/>
            <rect x="368" y="29" width="162" height="78" rx="6"/>
            <rect x="547" y="29" width="162" height="78" rx="6"/>
          </g>
          <g fill="#a7f3d0" stroke="#047857" stroke-width="1.5">
            <rect x="22" y="43" width="54" height="48" rx="3"/>
            <rect x="243" y="43" width="54" height="48" rx="3"/>
            <rect x="464" y="43" width="54" height="48" rx="3"/>
            <rect x="559" y="43" width="138" height="48" rx="3"/>
          </g>
          <g fill="#334155" font-family="sans-serif" font-size="14" text-anchor="middle">
            <text x="91" y="19">Start</text>
            <text x="270" y="19">Center</text>
            <text x="449" y="19">End</text>
            <text x="628" y="19">Stretch</text>
            <text x="360" y="125" font-size="12">Available cross-axis width shown by the outlined rectangles</text>
          </g>
        </svg>
