<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 140"
             width="100%" role="img" aria-labelledby="adl-weight-title adl-weight-desc"
             style="max-width:720px;height:auto">
          <title id="adl-weight-title">Content, Fixed and Weight allocation</title>
          <desc id="adl-weight-desc">A horizontal stack of 600 pixels: 80 for Content, 120 for Fixed, and 400 for Weight, consisting of 100 intrinsic plus 300 surplus.</desc>
          <rect x="8" y="30" width="704" height="64" rx="6" fill="none" stroke="#64748b" stroke-width="2"/>
          <rect x="13" y="35" width="92" height="54" rx="3" fill="#94a3b8"/>
          <rect x="109" y="35" width="139" height="54" rx="3" fill="#3b82f6"/>
          <rect x="252" y="35" width="455" height="54" rx="3" fill="#059669"/>
          <g font-family="sans-serif" font-size="14" fill="white" text-anchor="middle">
            <text x="59" y="56">Content</text><text x="59" y="75">80 px</text>
            <text x="178" y="56">Fixed</text><text x="178" y="75">120 px</text>
            <text x="480" y="56">Weight 1</text><text x="480" y="75">100 + 300 = 400 px</text>
          </g>
          <text x="360" y="19" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#334155">600 px available</text>
          <text x="360" y="125" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#475569">Gaps and margins omitted</text>
        </svg>
