name: Windows MSVC

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      BUILD_DIR: ${{ runner.temp }}/arcadia-build

    steps:
      - name: Check out Arcadia
        uses: actions/checkout@v4

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.1.3'

      - name: Configure Visual Studio 2022 (x64)
        shell: pwsh
        run: |
          cmake -S . -B "$env:BUILD_DIR" -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_C_FLAGS_INIT:STRING=/MP2 `
            -DCMAKE_CXX_FLAGS_INIT:STRING=/MP2 `
            -DArcadia.Engine.Visuals.Implementation.OpenGL4.Enabled=TRUE `
            -DArcadia.Engine.Audials.Implementation.OpenAL.Enabled=TRUE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install prebuilt Windows dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path (Join-Path $env:BUILD_DIR '.Dependencies'))) {
            cmake --build "$env:BUILD_DIR" --target Arcadia.InstallDependencies
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build
        shell: pwsh
        run: |
          cmake --build "$env:BUILD_DIR" --config "${{ matrix.configuration }}" --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir "$env:BUILD_DIR" -C "${{ matrix.configuration }}" `
            --output-on-failure --output-junit "$env:BUILD_DIR/test-results.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msvc-x64-${{ matrix.configuration }}-test-results
          path: ${{ runner.temp }}/arcadia-build/test-results.xml
          if-no-files-found: ignore
